name: Temporary ambient v1.5.4 validation

on:
  push:
    branches:
      - tmp/ambient-daylight-v154
    paths:
      - .github/workflows/validate-ambient-v154-temp.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/vitest.log
      - name: Build
        run: npm run build
      - name: Record successful validation
        run: |
          {
            echo "validated_source=dc5cdd9837ef3c74f81198dcc255df3df63bafab"
            echo "node=$(node --version)"
            echo "typecheck=pass"
            echo "build=pass"
            grep -E '^ *Tests +[0-9]+ passed' /tmp/vitest.log | tail -1 | sed 's/^ */vitest=/'
          } > AMBIENT_V154_VALIDATION.txt
          test "$(grep -c '^vitest=' AMBIENT_V154_VALIDATION.txt)" -eq 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AMBIENT_V154_VALIDATION.txt
          git commit -m "chore: record ambient v1.5.4 validation"
          git push origin HEAD:tmp/ambient-daylight-v154
