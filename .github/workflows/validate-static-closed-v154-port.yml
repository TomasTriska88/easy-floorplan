name: Validate Markvarec staticClosed v1.5.4 port

on:
  pull_request:
    branches:
      - feature/ambient-daylight

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply local-only staticClosed port with exact guards
        run: python3 .markvarec/port_static_closed_v154.py
      - name: Assert isolated patch surface
        run: |
          git diff --check
          ACTUAL=$(git diff --name-only | sort)
          EXPECTED=$(printf '%s\n' README.md src/editor-forms.test.ts src/editor-forms.ts src/render.test.ts src/render.ts src/types.ts | sort)
          test "$ACTUAL" = "$EXPECTED" || { echo "Unexpected patch surface:"; echo "$ACTUAL"; exit 1; }
          test -z "$(git diff --name-only -- 'src/ambient-daylight*')"
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
