name: Address ambient daylight review

on:
  push:
    branches:
      - feature/ambient-daylight
    paths:
      - .github/workflows/address-ambient-review.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply review fixes with exact guards
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/ambient-daylight.ts",
              '''export function ambientDaylightDayFactor(elevation: unknown): number {\n  const e = typeof elevation === "number" ? elevation : Number(elevation);\n  if (!Number.isFinite(e)) return 0;''',
              '''export function ambientDaylightDayFactor(elevation: unknown): number {\n  if (typeof elevation !== "number" || !Number.isFinite(elevation)) return 0;\n  const e = elevation;''',
          )

          replace_once(
              "src/ambient-daylight.test.ts",
              '''    expect(ambientDaylightDayFactor(Number.NaN)).toBe(0);\n  });\n\n  it("disappears at night even with a valid exterior window", () => {''',
              '''    expect(ambientDaylightDayFactor(Number.NaN)).toBe(0);\n  });\n\n  it("fails dark instead of coercing missing or non-numeric elevations to zero", () => {\n    expect(ambientDaylightDayFactor(null)).toBe(0);\n    expect(ambientDaylightDayFactor("")).toBe(0);\n    expect(ambientDaylightDayFactor(" ")).toBe(0);\n    expect(ambientDaylightDayFactor([])).toBe(0);\n  });\n\n  it("disappears at night even with a valid exterior window", () => {''',
          )

          replace_once(
              "src/ambient-daylight-integration.ts",
              '''/** Extra HA entities the host card must observe for this opt-in layer. */\nexport function ambientDaylightWatchedEntities(\n  config: Pick<FloorplanCardConfig, "ambientDaylight"> | null | undefined,\n): readonly string[] {\n  return ambientDaylightEnabled(config) ? ["sun.sun"] : [];\n}\n\n''',
              '''''',
          )

          replace_once(
              "src/ambient-daylight-integration.test.ts",
              '''import {\n  ambientDaylightEnabled,\n  ambientDaylightWatchedEntities,\n  renderAmbientDaylightLayer,\n} from "./ambient-daylight-integration";''',
              '''import { ambientDaylightEnabled, renderAmbientDaylightLayer } from "./ambient-daylight-integration";\nimport { collectWatchedEntities } from "./render";''',
          )
          replace_once(
              "src/ambient-daylight-integration.test.ts",
              '''  it("is a strict opt-in with an explicit sun watcher contract", () => {\n    expect(ambientDaylightEnabled(config())).toBe(false);\n    expect(ambientDaylightEnabled(config({ ambientDaylight: false }))).toBe(false);\n    expect(ambientDaylightEnabled(config({ ambientDaylight: true }))).toBe(true);\n    expect(ambientDaylightWatchedEntities(config())).toEqual([]);\n    expect(ambientDaylightWatchedEntities(config({ ambientDaylight: true }))).toEqual(["sun.sun"]);\n  });''',
              '''  it("is a strict opt-in and registers its sun input in the central watcher set", () => {\n    expect(ambientDaylightEnabled(config())).toBe(false);\n    expect(ambientDaylightEnabled(config({ ambientDaylight: false }))).toBe(false);\n    expect(ambientDaylightEnabled(config({ ambientDaylight: true }))).toBe(true);\n    expect(collectWatchedEntities(config())).not.toContain("sun.sun");\n    expect(collectWatchedEntities(config({ ambientDaylight: true }))).toContain("sun.sun");\n  });''',
          )

          replace_once(
              "src/render.ts",
              '''  // Sun dimming (#113) reads the elevation. Sunlight reads both halves — the\n  // azimuth for the direction, the elevation for whether there is any light —\n  // but only while it follows the real sun: a pinned sunBearing reads neither\n  // (see sunBearingOf and sunlightStrengthOf), so it needs no subscription.\n  if (c.sunDimming || (c.sunlight && !sunIsPinned(c))) ids.add("sun.sun");''',
              '''  // Sun dimming (#113) and ambient daylight read the elevation. Sunlight reads\n  // both halves — the azimuth for the direction, the elevation for whether\n  // there is any light — but only while it follows the real sun: a pinned\n  // sunBearing reads neither (see sunBearingOf and sunlightStrengthOf), so it\n  // needs no subscription.\n  if (c.sunDimming || c.ambientDaylight || (c.sunlight && !sunIsPinned(c))) ids.add("sun.sun");''',
          )

          replace_once(
              "src/floorplan-card.ts",
              '''import {\n  ambientDaylightWatchedEntities,\n  renderAmbientDaylightLayer,\n} from "./ambient-daylight-integration";''',
              '''import { renderAmbientDaylightLayer } from "./ambient-daylight-integration";''',
          )
          replace_once(
              "src/floorplan-card.ts",
              '''    this._watchedEntities = collectWatchedEntities(this._config);\n    for (const entityId of ambientDaylightWatchedEntities(this._config)) {\n      this._watchedEntities.add(entityId);\n    }''',
              '''    this._watchedEntities = collectWatchedEntities(this._config);''',
          )
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Commit reviewed changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ambient-daylight.ts src/ambient-daylight.test.ts src/ambient-daylight-integration.ts src/ambient-daylight-integration.test.ts src/render.ts src/floorplan-card.ts
          git diff --cached --check
          git commit -m "Address ambient daylight review feedback"
          git push origin HEAD:feature/ambient-daylight
